[workspace]
members = ["simulator", "configs", "sim_lib"]
resolver = "2"

[workspace.dependencies]
snafu = { version = "0.7.5", features = ["std"] }
tracing-test = { version = "0.1" }
tracing = { version = "0.1.29", features = ["attributes"] }
tracing-futures = { version = "0.2.5", features = ["futures-01"] }
tracing-subscriber = "0.3.5"
tracing-appender = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rand = "0.10"
rand_pcg = "0.10"
itertools = "0.12.1"
clap = { version = "4", features = ["derive", "string"] }
uuid = { version = "1.3.0", features = ["serde", "v4"] }
nix = { version = "0.30.1", features = ["fs", "signal", "process", "inotify"] }
memmap2 = "0.9.5"
schemars = "1"
gc = { git = "ssh://git@github.com/Veriqloud/kiwi_hw_control.git", branch = "master" }
