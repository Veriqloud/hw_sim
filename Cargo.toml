[package]
name = "hw_sim"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.73"
snafu = { version = "0.7.5", features = ["std"] }
tracing-test = { version = "0.1" }
tracing = { version = "0.1.29", features = ["attributes"] }
tracing-futures = { version = "0.2.5", features = ["futures-01"] }
tracing-subscriber = "0.3.5"
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"]}
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rand = "0.8.5"
tokio-test = "0.4.3"
futures-util = "0.3.28"
rand_pcg = "0.3.1"
itertools = "0.12.1"
clap = { version = "4", features = ["derive", "string"] } # For simu_controller CLI args
uuid = { version = "1.3.0", features = ["serde", "v4"] }
nix = { version = "0.30.1", features = ["fs"] }
memmap2 = "0.9.5"
gc = { git = "ssh://git@github.com/Veriqloud/kiwi_hw_control.git", branch = "master"  }
